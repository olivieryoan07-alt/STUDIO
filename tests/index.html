<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests STUDIO</title>
<style>
  body{margin:0;padding:20px;background:#10131a;color:#e6e9f0;
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  h1{font-size:18px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
  #summary{font-family:"SF Mono",Menlo,monospace;font-size:16px;margin:0 0 16px}
  #summary.ok{color:#52a06f}
  #summary.ko{color:#cf4b36}
  .case{font-family:"SF Mono",Menlo,monospace;font-size:12.5px;
        padding:5px 0;border-bottom:1px solid #242b38}
  .case.pass::before{content:"PASS ";color:#52a06f}
  .case.fail::before{content:"FAIL ";color:#cf4b36}
  .why{color:#8d97a8;padding-left:2.6em;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Tests STUDIO</h1>
<p id="summary">chargement…</p>
<div id="out"></div>

<script src="../vendor/mp4box.all.min.js"></script>
<script type="module">
  const summary = document.getElementById('summary');
  try {
    const { runTests } = await import('./harness.js');
    await import('./harness.test.js');
    await import('./track-summary.test.js');
    await import('./inspect.test.js');
    await import('./crop.test.js');
    await import('./with-resources.test.js');
    await import('./share.test.js');
    await import('./draw-plan.test.js');
    await import('./cache-strategy.test.js');
    await import('./report.test.js');
    await import('./audio.test.js');
    await import('./asc.test.js');
    await import('./fft.test.js');
    await import('./onsets.test.js');
    await import('./tempo.test.js');
    await import('./sections.test.js');
    await import('./excerpt.test.js');
    await import('./analyse-track.test.js');
    await import('./format.test.js');
    await import('./laplacian.test.js');
    const r = await runTests(document.getElementById('out'));
    summary.textContent = `${r.passed} passed, ${r.failed} failed`;
    summary.className = r.failed === 0 ? 'ok' : 'ko';
  } catch (e) {
    summary.textContent = `0 passed, 1 failed — chargement impossible : ${e.message}`;
    summary.className = 'ko';
  }
  document.title = summary.textContent;
</script>
</body>
</html>
