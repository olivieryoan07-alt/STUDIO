<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STUDIO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>STUDIO</title>
<style>
  :root{
    --ground:#10131a; --panel:#191e28; --line:#2e3747; --line-soft:#242b38;
    --txt:#e6e9f0; --dim:#8d97a8; --dimmer:#5f6878;
    --amber:#e9a640; --rouge:#cf4b36; --vert:#52a06f;
    --mono:"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--txt);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  h1{font-size:26px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:700}
  .version{font-family:var(--mono);font-size:12px;color:var(--dimmer)}
  .tagline{color:var(--dim);margin:0 0 20px;font-size:13.5px}
  .phase{
    border:1px solid var(--line);border-left:3px solid var(--amber);
    border-radius:3px;background:var(--panel);padding:14px 16px;
  }
  .phase h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;
            color:var(--amber);margin:0 0 7px}
  .phase p{margin:0 0 8px;color:var(--dim);font-size:13.5px}
  .phase p:last-child{margin-bottom:0}
  #net{font-family:var(--mono);font-size:12px;color:var(--dimmer);margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Studio</h1>
    <span class="version" id="version"></span>
  </header>
  <p class="tagline">Monteur de reels automatique.</p>

  <section class="phase">
    <h2>Phase 0 — socle mesuré</h2>
    <p>L'app est installée et démarre hors ligne. Les sondes de faisabilité arrivent aux tâches suivantes du plan.</p>
    <p>Rien n'est envoyé sur le réseau : les fichiers restent sur l'appareil.</p>
  </section>

  <p id="net"></p>
</div>

<script>
  window.STUDIO_VERSION = '0.1.0';
  document.getElementById('version').textContent = 'v' + window.STUDIO_VERSION;

  function paintNet() {
    document.getElementById('net').textContent =
      navigator.onLine ? 'réseau : en ligne' : 'réseau : hors ligne — l’app fonctionne quand même';
  }
  paintNet();
  addEventListener('online', paintNet);
  addEventListener('offline', paintNet);

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
